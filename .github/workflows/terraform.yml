name: Terraform

# A pull request runs terraform plan, and merging to main runs terraform apply. It can also be run by
# hand from the Actions tab, choosing plan, apply, or destroy. Apply and destroy only work from main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: To destroy, type this repository's name
        type: string
        default: ""

permissions: {}

jobs:
  terraform:
    permissions:
      contents: read
      pull-requests: write
    uses: Stemweave/shared-workflows/.github/workflows/terraform-hcp.yml@main
    with:
      action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'push' && 'apply' || 'plan') }}
      confirm: ${{ inputs.confirm }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_API_TOKEN_APPLY: ${{ secrets.TF_API_TOKEN_APPLY }}
